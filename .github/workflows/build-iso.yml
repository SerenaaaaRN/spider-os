name: Build ISO

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Label versi ISO (mis. v1.0)"
        required: false
        default: "dev"
  push:
    tags:
      - "v*"
      - "ci-*"

permissions:
  contents: read

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: debian:trixie
      options: --privileged

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates sudo live-build debootstrap \
            xorriso mtools squashfs-tools dosfstools fakeroot \
            syslinux syslinux-common isolinux \
            grub-pc-bin grub-efi-amd64-bin grub-common grub2-common \
            rsync xz-utils bzip2 cpio wget gnupg file

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Provision loop devices and show environment
        run: |
          [ -e /dev/loop-control ] || mknod /dev/loop-control c 10 237 || true
          for i in $(seq 0 7); do
            [ -e "/dev/loop$i" ] || mknod "/dev/loop$i" b 7 "$i" || true
          done
          echo "== disk =="; df -h /
          echo "== live-build =="; lb --version || true
          echo "== kernel =="; uname -a

      - name: Prepare hooks and auto scripts
        run: |
          # auto/* wajib executable supaya lb config/build/clean tidak
          # melewati opsi kustom (archive areas non-free-dll, bootappend, dll).
          chmod +x auto/* scripts/*.sh
          ./scripts/install-hooks.sh
          ls -l auto/

      - name: Build ISO
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          echo "Building SpiderOS version: $VERSION"
          ./scripts/build.sh "$VERSION"

      - name: Konfigurasi yang terpakai
        if: always()
        run: |
          echo "== archive areas / distribusi =="
          grep -hE '^LB_(ARCHIVE_AREAS|DISTRIBUTION)=' config/common config/chroot 2>/dev/null || true

      - name: Diagnosa kegagalan build
        if: failure()
        run: |
          # Annotation ::error:: tampil di halaman job publik tanpa perlu login.
          echo "::error::=== build.log (80 baris terakhir) ==="
          if [ -f build.log ]; then
            tail -n 80 build.log \
              | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/^/::error::/' || true
          else
            echo "::error::build.log tidak dibuat — kegagalan terjadi sebelum lb build"
          fi

      - name: Upload build log saat gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          retention-days: 14
          if-no-files-found: warn

      - name: Verify ISO
        run: |
          ls -lh dist/
          sha256sum -c dist/*.sha256

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: spideros-iso-${{ github.run_number }}
          path: |
            dist/*.iso
            dist/*.sha256
          retention-days: 14
