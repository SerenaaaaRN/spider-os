# SpiderOS — aktifkan tap-to-click untuk semua touchpad libinput.
# Tanpa ini, di banyak laptop (mis. ASUS Vivobook) tap tidak berfungsi
# dan pengguna harus menekan tombol fisik di bawah touchpad.
Section "InputClass"
    Identifier "libinput touchpad catchall"
    MatchIsTouchpad "on"
    MatchDevicePath "/dev/input/event*"
    Driver "libinput"
    Option "Tapping" "on"
    Option "TappingButtonMap" "lrm"
    Option "TappingDrag" "on"
    Option "ScrollMethod" "twofinger"
EndSection
